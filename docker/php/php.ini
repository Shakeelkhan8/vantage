; Vantage runtime PHP config.
; Tuned for a small single-VPS deployment, not a large fleet.

memory_limit = 512M
max_execution_time = 120

; CV uploads and pasted job descriptions.
upload_max_filesize = 25M
post_max_size = 26M

expose_php = Off
date.timezone = UTC

; Errors go to the container log, never to the response body.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; Ingestion pulls a lot of JSON; the default depth is fine but the parser
; benefits from a bigger buffer on large ATS board payloads.
serialize_precision = -1
